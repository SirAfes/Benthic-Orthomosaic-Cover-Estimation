name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt rasterio pyinstaller
      - name: Build
        run: |
          pyinstaller --onefile --name benthic-cover --paths src --collect-all rasterio --hidden-import joblib src/pipeline.py
          pyinstaller --onefile --name benthic-reference-sample --paths src --collect-all rasterio src/reference_sampling.py
          pyinstaller --onefile --windowed --name benthic-cover-gui --paths src --collect-all rasterio --hidden-import joblib src/gui.py
      - name: Smoke test
        run: |
          function Check($what) { if ($LASTEXITCODE -ne 0) { throw "$what failed with exit code $LASTEXITCODE" } }
          dist\benthic-cover.exe --help; Check "benthic-cover --help"
          dist\benthic-cover.exe detect --help; Check "benthic-cover detect --help"
          dist\benthic-reference-sample.exe --help; Check "benthic-reference-sample --help"
          python src/gui.py --selftest; Check "python gui selftest"
          $p = Start-Process dist\benthic-cover-gui.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI exe selftest failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: benthic-windows-exe
          path: dist/*.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe --title "${{ github.ref_name }}" --generate-notes
