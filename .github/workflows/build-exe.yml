name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt rasterio pyinstaller
      - name: Build
        run: |
          pyinstaller --onefile --name benthic-cover --paths src --collect-all rasterio --hidden-import joblib src/pipeline.py
          pyinstaller --onefile --name benthic-reference-sample --paths src --collect-all rasterio src/reference_sampling.py
      - name: Smoke test
        run: |
          dist\benthic-cover.exe --help
          dist\benthic-cover.exe objects --help
          dist\benthic-reference-sample.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: benthic-windows-exe
          path: dist/*.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe --title "${{ github.ref_name }}" --generate-notes
